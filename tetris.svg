<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="420" height="540">
  <defs>
    <style>
      .board { fill: #0d1117; stroke: #21262d; stroke-width: 1; }
      .grid  { stroke: #161b22; stroke-width: 0.5; fill: none; }
      .title { font-family: 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #c9d1d9; }
      .sub   { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #58a6ff; }
      .lbl   { font-family: 'Segoe UI', sans-serif; font-size: 10px; fill: #8b949e; }
      .val   { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #58a6ff; }
      .cell  { stroke: rgba(255,255,255,0.15); stroke-width: 0.5; }
      .cI { fill: #79c0ff; } .cO { fill: #e3b341; } .cT { fill: #bc8cff; }
      .cS { fill: #56d364; } .cZ { fill: #f85149; } .cJ { fill: #58a6ff; } .cL { fill: #f0883e; }

      /* GLOW BORDER */
      @keyframes glow { 0% { stroke: #6e40c9; } 50% { stroke: #58a6ff; } 100% { stroke: #6e40c9; } }
      .glowB { animation: glow 4s ease-in-out infinite; stroke-width: 2; }
      
      /* PULSE */
      @keyframes pulse { 0%{r:3;opacity:1;} 50%{r:5;opacity:.5;} 100%{r:3;opacity:1;} }
      .dot { animation: pulse 2s ease-in-out infinite; }

      /* BOARD SHAKE (triggers exactly when P10 hits) */
      @keyframes shake {
        0%, 53.9% { transform: translate(10px, 72px); }
        54% { transform: translate(5px, 67px); }
        54.5% { transform: translate(15px, 77px); }
        55% { transform: translate(5px, 77px); }
        55.5% { transform: translate(15px, 67px); }
        56%, 100% { transform: translate(10px, 72px); }
      }
      .board-group { animation: shake 30s infinite; }

      /* GLOBAL FADE (RESETS THE LOOP) */
      @keyframes globalFade { 0%, 92% { opacity: 1; } 96%, 98% { opacity: 0; } 100% { opacity: 1; } }
      .global-fade { animation: globalFade 30s infinite; }

      /* LINE CLEAR FLASH */
      @keyframes flash { 0%, 5% { opacity: 0; } 5.5% { opacity: 1; } 6% { opacity: 0; } 6.5% { opacity: 1; } 7%, 100% { opacity: 0; } }
      .flash { animation: flash 30s infinite; }

      /* BOTTOM ROW DISAPPEAR */
      @keyframes cr { 0%, 7% { opacity: 1; } 7.1%, 98% { opacity: 0; } 98.1%, 100% { opacity: 1; } }
      .clear-row { animation: cr 30s infinite; }

      /* UPPER ROWS SHIFT DOWN */
      @keyframes shift { 0%, 7% { transform: translateY(0); } 7.1%, 98% { transform: translateY(20px); } 98.1%, 100% { transform: translateY(0); } }
      .upper-blocks { animation: shift 30s infinite; }

      /* FALLING PIECES (Calculated flawlessly so bottom edges rest exactly on top edges) */
      @keyframes f1 { 0% { transform: translateY(-200px); opacity: 1; } 5%, 7% { transform: translateY(380px); opacity: 1; } 7.1%, 100% { transform: translateY(380px); opacity: 0; } }
      .p1 { animation: f1 30s infinite; }

      @keyframes f2 { 0%, 10% { transform: translateY(-200px); opacity: 0; } 10.1% { transform: translateY(-200px); opacity: 1; } 14%, 98% { transform: translateY(360px); opacity: 1; } 98.1%, 100% { transform: translateY(-200px); opacity: 0; } }
      .p2 { animation: f2 30s infinite; }

      @keyframes f3 { 0%, 15% { transform: translateY(-200px); opacity: 0; } 15.1% { transform: translateY(-200px); opacity: 1; } 19%, 98% { transform: translateY(320px); opacity: 1; } 98.1%, 100% { transform: translateY(-200px); opacity: 0; } }
      .p3 { animation: f3 30s infinite; }

      @keyframes f4 { 0%, 20% { transform: translateY(-200px); opacity: 0; } 20.1% { transform: translateY(-200px); opacity: 1; } 24%, 98% { transform: translateY(300px); opacity: 1; } 98.1%, 100% { transform: translateY(-200px); opacity: 0; } }
      .p4 { animation: f4 30s infinite; }

      @keyframes f5 { 0%, 25% { transform: translateY(-200px); opacity: 0; } 25.1% { transform: translateY(-200px); opacity: 1; } 29%, 98% { transform: translateY(260px); opacity: 1; } 98.1%, 100% { transform: translateY(-200px); opacity: 0; } }
      .p5 { animation: f5 30s infinite; }

      @keyframes f6 { 0%, 30% { transform: translateY(-200px); opacity: 0; } 30.1% { transform: translateY(-200px); opacity: 1; } 34%, 98% { transform: translateY(220px); opacity: 1; } 98.1%, 100% { transform: translateY(-200px); opacity: 0; } }
      .p6 { animation: f6 30s infinite; }

      @keyframes f7 { 0%, 35% { transform: translateY(-200px); opacity: 0; } 35.1% { transform: translateY(-200px); opacity: 1; } 39%, 98% { transform: translateY(180px); opacity: 1; } 98.1%, 100% { transform: translateY(-200px); opacity: 0; } }
      .p7 { animation: f7 30s infinite; }

      @keyframes f8 { 0%, 40% { transform: translateY(-200px); opacity: 0; } 40.1% { transform: translateY(-200px); opacity: 1; } 44%, 98% { transform: translateY(120px); opacity: 1; } 98.1%, 100% { transform: translateY(-200px); opacity: 0; } }
      .p8 { animation: f8 30s infinite; }

      @keyframes f9 { 0%, 45% { transform: translateY(-200px); opacity: 0; } 45.1% { transform: translateY(-200px); opacity: 1; } 49%, 98% { transform: translateY(60px); opacity: 1; } 98.1%, 100% { transform: translateY(-200px); opacity: 0; } }
      .p9 { animation: f9 30s infinite; }

      @keyframes f10 { 0%, 50% { transform: translateY(-200px); opacity: 0; } 50.1% { transform: translateY(-200px); opacity: 1; } 54%, 98% { transform: translateY(0px); opacity: 1; } 98.1%, 100% { transform: translateY(-200px); opacity: 0; } }
      .p10 { animation: f10 30s infinite; }

      /* GAME OVER OVERLAY */
      @keyframes go_overlay { 0%, 55.9% { opacity: 0; } 56%, 92% { opacity: 0.85; } 98%, 100% { opacity: 0; } }
      .go-overlay { animation: go_overlay 30s infinite; }

      /* GAME OVER TEXT */
      @keyframes go_text { 0%, 55.9% { opacity: 0; transform: scale(0.1); } 56% { opacity: 1; transform: scale(1.2); } 58%, 92% { opacity: 1; transform: scale(1); } 98%, 100% { opacity: 0; transform: scale(1); } }
      .go-text { animation: go_text 30s infinite; transform-origin: center; transform-box: fill-box; }

      /* SCORE TOGGLES */
      @keyframes s1 { 0%, 7% { opacity: 1; } 7.1%, 100% { opacity: 0; } }
      @keyframes s2 { 0%, 7% { opacity: 0; } 7.1%, 100% { opacity: 1; } }
      .s1 { animation: s1 30s infinite; }
      .s2 { animation: s2 30s infinite; }
    </style>

    <clipPath id="boardClip">
      <rect x="0" y="0" width="200" height="400" />
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect width="420" height="540" rx="12" fill="#010409"/>
  <rect x="4" y="4" width="412" height="532" rx="10" class="glowB" fill="none"/>

  <!-- HEADER -->
  <text x="210" y="38" text-anchor="middle" class="title">🎮 Self Playing Tetris</text>
  <circle cx="18" cy="42" fill="#6e40c9" class="dot" r="3"/>
  <circle cx="402" cy="42" fill="#58a6ff" class="dot" r="3"/>

  <!-- GAME BOARD -->
  <g class="board-group" transform="translate(10,72)">
    <rect class="board" x="0" y="0" width="200" height="400" rx="4"/>

    <g class="global-fade" clip-path="url(#boardClip)">
      <!-- Grid -->
      <g class="grid">
        <line x1="20" y1="0" x2="20" y2="400"/><line x1="40" y1="0" x2="40" y2="400"/>
        <line x1="60" y1="0" x2="60" y2="400"/><line x1="80" y1="0" x2="80" y2="400"/>
        <line x1="100" y1="0" x2="100" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/>
        <line x1="140" y1="0" x2="140" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
        <line x1="180" y1="0" x2="180" y2="400"/>
        <line x1="0" y1="20" x2="200" y2="20"/><line x1="0" y1="40" x2="200" y2="40"/>
        <line x1="0" y1="60" x2="200" y2="60"/><line x1="0" y1="80" x2="200" y2="80"/>
        <line x1="0" y1="100" x2="200" y2="100"/><line x1="0" y1="120" x2="200" y2="120"/>
        <line x1="0" y1="140" x2="200" y2="140"/><line x1="0" y1="160" x2="200" y2="160"/>
        <line x1="0" y1="180" x2="200" y2="180"/><line x1="0" y1="200" x2="200" y2="200"/>
        <line x1="0" y1="220" x2="200" y2="220"/><line x1="0" y1="240" x2="200" y2="240"/>
        <line x1="0" y1="260" x2="200" y2="260"/><line x1="0" y1="280" x2="200" y2="280"/>
        <line x1="0" y1="300" x2="200" y2="300"/><line x1="0" y1="320" x2="200" y2="320"/>
        <line x1="0" y1="340" x2="200" y2="340"/><line x1="0" y1="360" x2="200" y2="360"/>
        <line x1="0" y1="380" x2="200" y2="380"/>
      </g>

      <!-- Pre-placed blocks that clear -->
      <g class="clear-row">
        <rect x="0" y="380" width="20" height="20" class="cI cell" rx="2" />
        <rect x="20" y="380" width="20" height="20" class="cJ cell" rx="2" />
        <rect x="40" y="380" width="20" height="20" class="cL cell" rx="2" />
        <!-- Gap completely open from x=60 to 120 -->
        <rect x="140" y="380" width="20" height="20" class="cT cell" rx="2" />
        <rect x="160" y="380" width="20" height="20" class="cS cell" rx="2" />
        <rect x="180" y="380" width="20" height="20" class="cO cell" rx="2" />
      </g>

      <!-- Pre-placed blocks that shift down (Middle completely removed!) -->
      <g class="upper-blocks">
        <rect x="0" y="360" width="20" height="20" class="cS cell" rx="2" />
        <rect x="20" y="360" width="20" height="20" class="cO cell" rx="2" />
        <rect x="40" y="360" width="20" height="20" class="cZ cell" rx="2" />
        <rect x="140" y="360" width="20" height="20" class="cZ cell" rx="2" />
        <rect x="160" y="360" width="20" height="20" class="cZ cell" rx="2" />
        <rect x="180" y="360" width="20" height="20" class="cJ cell" rx="2" />
        
        <rect x="0" y="340" width="20" height="20" class="cT cell" rx="2" />
        <rect x="20" y="340" width="20" height="20" class="cL cell" rx="2" />
        <rect x="40" y="340" width="20" height="20" class="cL cell" rx="2" />
        <rect x="140" y="340" width="20" height="20" class="cL cell" rx="2" />
        <rect x="160" y="340" width="20" height="20" class="cL cell" rx="2" />
        <rect x="180" y="340" width="20" height="20" class="cO cell" rx="2" />
        
        <rect x="0" y="320" width="20" height="20" class="cZ cell" rx="2" />
        <rect x="20" y="320" width="20" height="20" class="cZ cell" rx="2" />
        <rect x="160" y="320" width="20" height="20" class="cS cell" rx="2" />
        <rect x="180" y="320" width="20" height="20" class="cS cell" rx="2" />
        
        <rect x="0" y="300" width="20" height="20" class="cL cell" rx="2" />
        <rect x="20" y="300" width="20" height="20" class="cL cell" rx="2" />
        <rect x="180" y="300" width="20" height="20" class="cL cell" rx="2" />
      </g>

      <!-- PIECE 1: I-horiz (drops clean into gap) -->
      <g class="p1">
        <rect x="60" y="0" width="20" height="20" class="cI cell" rx="2" />
        <rect x="80" y="0" width="20" height="20" class="cI cell" rx="2" />
        <rect x="100" y="0" width="20" height="20" class="cI cell" rx="2" />
        <rect x="120" y="0" width="20" height="20" class="cI cell" rx="2" />
      </g>

      <!-- PIECE 2: O-piece -->
      <g class="p2">
        <rect x="80" y="0" width="20" height="20" class="cO cell" rx="2" />
        <rect x="100" y="0" width="20" height="20" class="cO cell" rx="2" />
        <rect x="80" y="20" width="20" height="20" class="cO cell" rx="2" />
        <rect x="100" y="20" width="20" height="20" class="cO cell" rx="2" />
      </g>

      <!-- PIECE 3: T-piece (down) -->
      <g class="p3">
        <rect x="60" y="0" width="20" height="20" class="cT cell" rx="2" />
        <rect x="80" y="0" width="20" height="20" class="cT cell" rx="2" />
        <rect x="100" y="0" width="20" height="20" class="cT cell" rx="2" />
        <rect x="80" y="20" width="20" height="20" class="cT cell" rx="2" />
      </g>

      <!-- PIECE 4: I-horiz -->
      <g class="p4">
        <rect x="60" y="0" width="20" height="20" class="cI cell" rx="2" />
        <rect x="80" y="0" width="20" height="20" class="cI cell" rx="2" />
        <rect x="100" y="0" width="20" height="20" class="cI cell" rx="2" />
        <rect x="120" y="0" width="20" height="20" class="cI cell" rx="2" />
      </g>

      <!-- PIECE 5: Z-piece -->
      <g class="p5">
        <rect x="60" y="0" width="20" height="20" class="cZ cell" rx="2" />
        <rect x="80" y="0" width="20" height="20" class="cZ cell" rx="2" />
        <rect x="80" y="20" width="20" height="20" class="cZ cell" rx="2" />
        <rect x="100" y="20" width="20" height="20" class="cZ cell" rx="2" />
      </g>

      <!-- PIECE 6: S-piece -->
      <g class="p6">
        <rect x="80" y="0" width="20" height="20" class="cS cell" rx="2" />
        <rect x="100" y="0" width="20" height="20" class="cS cell" rx="2" />
        <rect x="60" y="20" width="20" height="20" class="cS cell" rx="2" />
        <rect x="80" y="20" width="20" height="20" class="cS cell" rx="2" />
      </g>

      <!-- PIECE 7: O-piece -->
      <g class="p7">
        <rect x="80" y="0" width="20" height="20" class="cO cell" rx="2" />
        <rect x="100" y="0" width="20" height="20" class="cO cell" rx="2" />
        <rect x="80" y="20" width="20" height="20" class="cO cell" rx="2" />
        <rect x="100" y="20" width="20" height="20" class="cO cell" rx="2" />
      </g>

      <!-- PIECE 8: L-piece -->
      <g class="p8">
        <rect x="80" y="0" width="20" height="20" class="cL cell" rx="2" />
        <rect x="80" y="20" width="20" height="20" class="cL cell" rx="2" />
        <rect x="80" y="40" width="20" height="20" class="cL cell" rx="2" />
        <rect x="100" y="40" width="20" height="20" class="cL cell" rx="2" />
      </g>

      <!-- PIECE 9: J-piece -->
      <g class="p9">
        <rect x="100" y="0" width="20" height="20" class="cJ cell" rx="2" />
        <rect x="100" y="20" width="20" height="20" class="cJ cell" rx="2" />
        <rect x="80" y="40" width="20" height="20" class="cJ cell" rx="2" />
        <rect x="100" y="40" width="20" height="20" class="cJ cell" rx="2" />
      </g>

      <!-- PIECE 10: L-piece (Reaches exactly y=0 to trigger Game Over) -->
      <g class="p10">
        <rect x="80" y="0" width="20" height="20" class="cL cell" rx="2" />
        <rect x="80" y="20" width="20" height="20" class="cL cell" rx="2" />
        <rect x="80" y="40" width="20" height="20" class="cL cell" rx="2" />
        <rect x="100" y="40" width="20" height="20" class="cL cell" rx="2" />
      </g>

      <!-- LINE CLEAR FLASH -->
      <rect x="0" y="380" width="200" height="20" fill="#ffffff" opacity="0" class="flash" rx="2" />
    </g>

    <!-- GAME OVER OVERLAY -->
    <rect x="0" y="0" width="200" height="400" fill="#000" class="go-overlay" rx="4" />
    <text x="100" y="200" text-anchor="middle" fill="#f85149" font-family="'Courier New', monospace" font-weight="900" font-size="28" class="go-text">GAME OVER</text>
  </g>

  <!-- SIDE PANEL -->
  <g transform="translate(225,72)">
    <!-- Next Piece Box -->
    <rect x="0" y="0" width="100" height="90" rx="6" fill="#0d1117" stroke="#21262d" />
    <text x="50" y="18" text-anchor="middle" class="lbl">NEXT</text>
    <g transform="translate(30, 35)">
      <rect x="0" y="0" width="20" height="20" class="cS cell" rx="2"/>
      <rect x="20" y="0" width="20" height="20" class="cS cell" rx="2"/>
      <rect x="-20" y="20" width="20" height="20" class="cS cell" rx="2"/>
      <rect x="0" y="20" width="20" height="20" class="cS cell" rx="2"/>
    </g>

    <!-- Score Box -->
    <rect x="0" y="105" width="100" height="55" rx="6" fill="#0d1117" stroke="#21262d" />
    <text x="50" y="123" text-anchor="middle" class="lbl">SCORE</text>
    <text x="50" y="146" text-anchor="middle" class="val s1">12,480</text>
    <text x="50" y="146" text-anchor="middle" class="val s2">12,880</text>

    <!-- Level Box -->
    <rect x="0" y="175" width="100" height="55" rx="6" fill="#0d1117" stroke="#21262d" />
    <text x="50" y="193" text-anchor="middle" class="lbl">LEVEL</text>
    <text x="50" y="216" text-anchor="middle" class="val">7</text>

    <!-- Lines Box -->
    <rect x="0" y="245" width="100" height="55" rx="6" fill="#0d1117" stroke="#21262d" />
    <text x="50" y="263" text-anchor="middle" class="lbl">LINES</text>
    <text x="50" y="286" text-anchor="middle" class="val s1">42</text>
    <text x="50" y="286" text-anchor="middle" class="val s2">43</text>

    <!-- Auto-play indicator -->
    <rect x="0" y="320" width="100" height="80" rx="6" fill="#0d1117" stroke="#21262d" />
    <text x="50" y="340" text-anchor="middle" class="lbl">AUTO-PLAY</text>
    <text x="50" y="358" text-anchor="middle" style="font-family:'Segoe UI',sans-serif;font-size:9px;fill:#484f58;">AI is making</text>
    <text x="50" y="372" text-anchor="middle" style="font-family:'Segoe UI',sans-serif;font-size:9px;fill:#484f58;">optimal moves</text>
    <circle cx="50" cy="390" r="3" fill="#56d364" class="dot" />
  </g>

  <!-- FOOTER -->
  <text x="210" y="510" text-anchor="middle" style="font-family:'Segoe UI',sans-serif;font-size:10px;fill:#484f58;">github.com/saugatedith</text>
  <text x="210" y="526" text-anchor="middle" style="font-family:'Segoe UI',sans-serif;font-size:8px;fill:#30363d;">Pure CSS Animation • No JavaScript</text>
</svg>
